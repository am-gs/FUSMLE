<!DOCTYPE html><html lang="en-US"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUuSMLE | Settings</title>
<link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/mainapp.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>(function(){var o=window.fetch;window.fetch=function(u,t){if(typeof u=="string"&&u.startsWith("/api/")){u+=(u.includes("?")?"&":"?")+"x-vercel-protection-bypass=aiQnOHnOxAigGfoxw5QLjs4u03EZm0Pg"}}return o.call(this,u,t)}})();</script></head><body>
<div class="navbar-uworld"><div class="container-fluid d-flex justify-content-between align-items-center px-3">
<img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 20'><text y='16' fill='white' font-size='16' font-weight='bold'>FUuSMLE</text></svg>" height="28" alt="FUuSMLE Logo">
<span class="user-name" id="userInfo" style="border:none">Settings</span>
</div></div>
<div class="sidebar-uworld">
<div class="nav flex-column">
<a class="nav-link" href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a class="nav-link" href="/createtest"><i class="fas fa-plus-circle"></i> Create Test</a>
<a class="nav-link" href="/history"><i class="fas fa-history"></i> My Results</a>
<a class="nav-link" href="/performance"><i class="fas fa-chart-bar"></i> Performance</a>
<a class="nav-link active" href="/settings"><i class="fas fa-cog"></i> Settings</a>
<hr style="border-color:rgba(167,177,194,0.2);margin:10px 20px">
<a class="nav-link" href="/" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div></div>
<div class="main-content">
<h4 style="font-weight:300;margin-bottom:20px">Account Settings</h4>
<div class="row">
<div class="col-md-6 mb-4">
<div class="stats-card">
<h5 style="font-size:14px;font-weight:600;color:#555;margin-bottom:15px"><i class="fas fa-user"></i> Profile</h5>
<div id="profileMsg" class="alert" style="display:none;font-size:13px;padding:8px 12px"></div>
<form id="profileForm">
<div class="form-group">
<label style="font-size:13px;font-weight:600;color:#555">Email</label>
<input type="email" class="form-control" id="accountEmail" disabled style="background:#f5f5f5">
<small class="text-muted">Email cannot be changed.</small>
</div>
<div class="form-group">
<label style="font-size:13px;font-weight:600;color:#555">Display Name</label>
<input type="text" class="form-control" id="displayName" maxlength="100" autocomplete="name" required>
</div>
<button type="submit" class="btn btn-uworld" id="profileSaveBtn"><i class="fas fa-save"></i> Save Name</button>
</form>
</div></div>
<div class="col-md-6 mb-4">
<div class="stats-card">
<h5 style="font-size:14px;font-weight:600;color:#555;margin-bottom:15px"><i class="fas fa-lock"></i> Change Password</h5>
<div id="passwordMsg" class="alert" style="display:none;font-size:13px;padding:8px 12px"></div>
<form id="passwordForm">
<div class="form-group">
<label style="font-size:13px;font-weight:600;color:#555">Current Password</label>
<input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required>
</div>
<div class="form-group">
<label style="font-size:13px;font-weight:600;color:#555">New Password</label>
<input type="password" class="form-control" id="newPassword" minlength="8" autocomplete="new-password" required>
<small class="text-muted">At least 8 characters.</small>
</div>
<div class="form-group">
<label style="font-size:13px;font-weight:600;color:#555">Confirm New Password</label>
<input type="password" class="form-control" id="confirmPassword" minlength="8" autocomplete="new-password" required>
</div>
<button type="submit" class="btn btn-uworld" id="passwordSaveBtn"><i class="fas fa-key"></i> Update Password</button>
</form>
</div></div>
</div></div>
<script>
const API=window.location.origin;
function getAuthToken(){return localStorage.getItem('uworldToken')||''}
function requireAuth(){if(!getAuthToken()){window.location.href='/index.html';return false}return true}
function handleExpiredSession(){localStorage.removeItem('uworldToken');localStorage.removeItem('uworldUser');window.location.href='/index.html';}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+getAuthToken()};}
function showMsg(id,type,text){var e=document.getElementById(id);e.className='alert alert-'+type;e.style.display='block';e.style.fontSize='13px';e.style.padding='8px 12px';e.textContent=text;}

async function loadAccount(){
if(!requireAuth())return;
try{
const r=await fetch(API+'/api/session',{headers:authHeaders()});
if(r.status===401){handleExpiredSession();return;}
if(r.ok){const d=await r.json();var u=d.user||{};
document.getElementById('userInfo').textContent=u.name||u.email||'Account';
document.getElementById('accountEmail').value=u.email||'';
document.getElementById('displayName').value=u.name||'';
}}catch(e){console.error(e);}
}

document.getElementById('profileForm').addEventListener('submit',async function(e){
e.preventDefault();
var name=document.getElementById('displayName').value.trim();
var btn=document.getElementById('profileSaveBtn');btn.disabled=true;
try{
const r=await fetch(API+'/api/account/profile',{method:'POST',headers:authHeaders(),body:JSON.stringify({name:name})});
const d=await r.json().catch(function(){return {};});
if(r.status===401){handleExpiredSession();return;}
if(r.ok){
var u={};try{u=JSON.parse(localStorage.getItem('uworldUser')||'{}')}catch(_){}
u.name=(d.user&&d.user.name)||name;localStorage.setItem('uworldUser',JSON.stringify(u));
document.getElementById('userInfo').textContent=u.name||u.email||'Account';
showMsg('profileMsg','success','Display name updated.');
}else{showMsg('profileMsg','danger',d.error||'Could not update name.');}
}catch(err){showMsg('profileMsg','danger','Network error. Try again.');}
finally{btn.disabled=false;}
});

document.getElementById('passwordForm').addEventListener('submit',async function(e){
e.preventDefault();
var cur=document.getElementById('currentPassword').value;
var nw=document.getElementById('newPassword').value;
var cf=document.getElementById('confirmPassword').value;
if(nw!==cf){showMsg('passwordMsg','danger','New passwords do not match.');return;}
if(nw.length<8){showMsg('passwordMsg','danger','New password must be at least 8 characters.');return;}
var btn=document.getElementById('passwordSaveBtn');btn.disabled=true;
try{
const r=await fetch(API+'/api/account/password',{method:'POST',headers:authHeaders(),body:JSON.stringify({currentPassword:cur,newPassword:nw})});
const d=await r.json().catch(function(){return {};});
if(r.ok){document.getElementById('passwordForm').reset();showMsg('passwordMsg','success','Password updated.');}
else if(r.status===401&&d.error&&d.error.toLowerCase().indexOf('current password')>=0){showMsg('passwordMsg','danger',d.error);}
else if(r.status===401){handleExpiredSession();}
else{showMsg('passwordMsg','danger',d.error||'Could not update password.');}
}catch(err){showMsg('passwordMsg','danger','Network error. Try again.');}
finally{btn.disabled=false;}
});

document.getElementById('logoutLink').addEventListener('click',function(e){e.preventDefault();var token=getAuthToken();localStorage.removeItem('uworldToken');localStorage.removeItem('uworldUser');function done(){window.location.href='/index.html';}fetch(API+'/api/logout',{method:'POST',headers:{'Authorization':'Bearer '+token},keepalive:true}).then(done,done);});
loadAccount();
</script>
</body></html>
