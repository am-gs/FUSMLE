<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUuSMLE Login</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Open Sans,sans-serif;background:linear-gradient(135deg,#e3f2fd,#f7fbff);min-height:100vh;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:420px;background:#fff;border:1px solid #e7eaec;border-radius:10px;box-shadow:0 12px 40px rgba(21,101,192,.12);padding:32px}
.brand{font-size:28px;font-weight:600;color:#1565c0;margin-bottom:4px}.muted{color:#6c757d;font-size:14px}.btn-uworld{background:#1e88e5;color:#fff;border:none}.btn-uworld:hover{background:#1565c0;color:#fff}.toggle-link{cursor:pointer;color:#1e88e5}
</style>
</head><body>
<div class="auth-card">
<div class="text-center mb-4"><div class="brand">FUuSMLE</div><div class="muted">Persistent NBME/QBank access</div></div>
<div id="authError" class="alert alert-danger" style="display:none"></div>
<form id="loginForm">
<h5 class="mb-3">Sign in</h5>
<div class="form-group"><label>Email</label><input class="form-control" id="loginEmail" type="email" required autocomplete="email"></div>
<div class="form-group"><label>Password</label><input class="form-control" id="loginPassword" type="password" required autocomplete="current-password"></div>
<button class="btn btn-uworld btn-block" type="submit"><i class="fas fa-sign-in-alt"></i> Sign in</button>
<p class="text-center mt-3 mb-0 muted">No account? <span class="toggle-link" id="showRegister">Create one</span></p>
</form>
<form id="registerForm" style="display:none">
<h5 class="mb-3">Create account</h5>
<div class="form-group"><label>Name</label><input class="form-control" id="registerName" autocomplete="name"></div>
<div class="form-group"><label>Email</label><input class="form-control" id="registerEmail" type="email" required autocomplete="email"></div>
<div class="form-group"><label>Password</label><input class="form-control" id="registerPassword" type="password" minlength="8" required autocomplete="new-password"></div>
<button class="btn btn-uworld btn-block" type="submit"><i class="fas fa-user-plus"></i> Create account</button>
<p class="text-center mt-3 mb-0 muted">Already registered? <span class="toggle-link" id="showLogin">Sign in</span></p>
</form>
</div>
<script>
function showError(message){var e=document.getElementById('authError');e.textContent=message;e.style.display='block'}
function saveAuth(payload){localStorage.setItem('uworldToken',payload.token);localStorage.setItem('uworldUser',JSON.stringify(payload.user||{}));window.location.href='dashboard.html'}
async function postAuth(url,body){var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.error||'Authentication failed');saveAuth(d)}
document.getElementById('showRegister').onclick=function(){document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';document.getElementById('authError').style.display='none'}
document.getElementById('showLogin').onclick=function(){document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block';document.getElementById('authError').style.display='none'}
document.getElementById('loginForm').onsubmit=function(e){e.preventDefault();postAuth('/api/auth/login',{email:loginEmail.value,password:loginPassword.value}).catch(function(err){showError(err.message)})}
document.getElementById('registerForm').onsubmit=function(e){e.preventDefault();postAuth('/api/register',{name:registerName.value,email:registerEmail.value,password:registerPassword.value}).catch(function(err){showError(err.message)})}
if(localStorage.getItem('uworldToken'))fetch('/api/session',{headers:{'Authorization':'Bearer '+localStorage.getItem('uworldToken')}}).then(function(r){if(r.ok)window.location.href='dashboard.html'})
</script>
</body></html>
