<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUuSMLE Recovery</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Open Sans,sans-serif;background:linear-gradient(135deg,#e3f2fd,#f7fbff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.recovery-card{width:100%;max-width:760px;background:#fff;border:1px solid #e7eaec;border-radius:10px;box-shadow:0 12px 40px rgba(21,101,192,.12);padding:32px}
.brand{font-size:28px;font-weight:600;color:#1565c0;margin-bottom:4px}.muted{color:#6c757d;font-size:14px}.value-box{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;border:1px solid #dbe5f0;border-radius:8px;background:#f8fbff;padding:12px}.btn-uworld{background:#1e88e5;color:#fff;border:none}.btn-uworld:hover{background:#1565c0;color:#fff}.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:#5f6b7a;text-transform:uppercase}
</style>
</head><body>
<div class="recovery-card">
<div class="text-center mb-4"><div class="brand">FUuSMLE</div><div class="muted">Recovery helper for the current browser only</div></div>
<div class="alert alert-warning mb-4">Open this page on the same Safari/iPad browser that previously had the active session. Copy the values below exactly and send them back.</div>
<div class="mb-4">
<div class="label mb-2">uworldToken</div>
<div id="tokenValue" class="value-box"></div>
<button class="btn btn-uworld btn-sm mt-2" id="copyToken"><i class="fas fa-copy"></i> Copy token</button>
</div>
<div class="mb-4">
<div class="label mb-2">uworldUser</div>
<div id="userValue" class="value-box"></div>
<button class="btn btn-outline-secondary btn-sm mt-2" id="copyUser"><i class="fas fa-copy"></i> Copy user</button>
</div>
<div class="mb-0">
<div class="label mb-2">document.cookie</div>
<div id="cookieValue" class="value-box"></div>
<button class="btn btn-outline-secondary btn-sm mt-2" id="copyCookie"><i class="fas fa-copy"></i> Copy cookie</button>
</div>
</div>
<script>
function text(id,value){document.getElementById(id).textContent=value||'null'}
function copy(value){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(value||'');var t=document.createElement('textarea');t.value=value||'';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);return Promise.resolve()}
var token=localStorage.getItem('uworldToken');
var user=localStorage.getItem('uworldUser');
var cookie=document.cookie||'';
text('tokenValue',token);
text('userValue',user);
text('cookieValue',cookie);
document.getElementById('copyToken').onclick=function(){copy(token)};
document.getElementById('copyUser').onclick=function(){copy(user)};
document.getElementById('copyCookie').onclick=function(){copy(cookie)};
</script>
</body></html>
